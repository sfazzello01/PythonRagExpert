<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Codebase Expert</title>

    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
</head>

<body class="dark-theme">

<header>

    <a href="/" class="link-header-style">
        ⬅ Home Progetto
    </a>

    <div class="system-status">
        <span>Backend:
            <strong class="{{ status.backend }}">
                {{ status.backend }}
            </strong>
        </span>

        <span>DB:
            <strong class="{{ status.database }}">
                {{ status.database }}
            </strong>
        </span>

        <span>Ollama:
            <strong class="{{ status.ollama }}">
                {{ status.ollama }}
            </strong>
        </span>

        <span>Esperto:
            <strong class="{{ status.esperto }}">
                {{ status.esperto }}
            </strong>
        </span>
        
    </div>

</header>


<main class="container">

    <h2>Codebase Expert</h2>

    <form id="expert-form" class="card main-form" autocomplete="off">

        <div class="form-group">

            <label for="question">
                Domanda
            </label>

            <textarea
                    id="question"
                    name="question"
                    rows="5"
                    placeholder="Scrivi qui la tua domanda sulla codebase"
                    autocomplete="off"
                    required></textarea>

        </div>

        <div class="form-row">

            <button
                    type="submit"
                    id="submit-btn"
                    class="btn-primary">

                Chiedi all'esperto

            </button>

            <button
                    type="button"
                    id="stop-btn"
                    class="btn-secondary"
                    style="display:none;">

                &#9632; Interrompi

            </button>

        </div>

    </form>


    <div class="results-grid">

        <section class="card result-text">

            <h3>Risposta</h3>

            <div
                    id="answer"
                    class="scroll-box markdown-content">

                Fai una domanda alla codebase.

            </div>

        </section>


        <section class="card result-eval">

            <h3>Informazioni</h3>

            <div class="metrics">

                <div class="metric-item">

                    <span>Stato</span>

                    <strong id="status">

                        Pronto

                    </strong>

                </div>

                <div class="metric-item" id="sources-item" style="display:none;">

                    <span>Fonti</span>

                    <div id="sources-list" class="sources-list"></div>

                </div>

            </div>

        </section>

    </div>

</main>


<script>

document.addEventListener("DOMContentLoaded", () => {

    const form         = document.getElementById("expert-form");
    const textarea     = document.getElementById("question");
    const answer       = document.getElementById("answer");
    const status       = document.getElementById("status");
    const submitBtn    = document.getElementById("submit-btn");
    const stopBtn      = document.getElementById("stop-btn");
    const sourcesItem  = document.getElementById("sources-item");
    const sourcesList  = document.getElementById("sources-list");

    let currentController = null;

    function renderMarkdown(text){
        if(window.marked){
            const html = marked.parse(text, { breaks:true, mangle:false, headerIds:false });
            answer.innerHTML = window.DOMPurify ? DOMPurify.sanitize(html) : html;
        } else {
            answer.textContent = text;
        }
    }

    function displaySources(sources){
        sourcesList.innerHTML = "";
        if(!sources || sources.length === 0){
            sourcesItem.style.display = "none";
            return;
        }
        sources.forEach((source, index) => {
            const details = document.createElement("details");
            details.className = "source-card";

            const summary = document.createElement("summary");
            summary.className = "source-summary";

            const title = document.createElement("div");
            title.className = "source-title";
            title.textContent = `${index + 1}. ${source.filename || "Sorgente"}`;

            const meta = document.createElement("div");
            meta.className = "source-meta";
            const parts = [];
            if(source.service){
                parts.push(source.service);
            }
            if(source.symbol_name){
                parts.push(source.symbol_name);
            }
            if(source.chunk_type){
                parts.push(source.chunk_type);
            }
            if(source.start_line !== undefined && source.end_line !== undefined && source.start_line !== null && source.end_line !== null){
                parts.push(`L${source.start_line}-L${source.end_line}`);
            }
            if(source.score !== undefined && source.score !== null){
                parts.push(`score ${Number(source.score).toFixed(4)}`);
            }
            meta.textContent = parts.join(" • ");

            const content = document.createElement("pre");
            content.className = "source-content";
            content.textContent = source.content || "";

            summary.appendChild(title);
            summary.appendChild(meta);
            details.appendChild(summary);
            details.appendChild(content);
            sourcesList.appendChild(details);
        });
        sourcesItem.style.display = "block";
    }

    stopBtn.addEventListener("click", () => {
        if(currentController){
            currentController.abort();
        }
    });

    form.addEventListener("submit", async (e) => {

        e.preventDefault();

        const question = textarea.value.trim();

        if(!question){
            answer.textContent = "Scrivi una domanda prima di inviare.";
            status.textContent = "Pronto";
            textarea.focus();
            return;
        }

        currentController = new AbortController();

        submitBtn.disabled = true;
        submitBtn.textContent = "Sto pensando...";
        stopBtn.style.display = "inline-block";
        status.textContent = "Generazione";
        answer.textContent = "";
        sourcesItem.style.display = "none";
        sourcesList.innerHTML = "";

        try{

            const response = await fetch("/ask", {
                method:  "POST",
                headers: { "Content-Type": "application/json" },
                body:    JSON.stringify({ message: question }),
                signal:  currentController.signal
            });

            if(!response.ok){
                const errorText = await response.text();
                throw new Error(errorText || "Errore nella richiesta");
            }

            const reader  = response.body.getReader();
            const decoder = new TextDecoder();

            let fullText       = "";
            let sourcesHandled = false;

            while(true){

                const { done, value } = await reader.read();
                if(done) break;

                fullText += decoder.decode(value, { stream: true });

                // Extract the SOURCES: header from the very first line
                if(!sourcesHandled && fullText.includes("\n")){
                    const nl = fullText.indexOf("\n");
                    const firstLine = fullText.substring(0, nl);
                    if(firstLine.startsWith("SOURCES:")){
                        try{
                            const data = JSON.parse(firstLine.substring(8));
                            displaySources(data.sources || data.files);
                        } catch(_){}
                        fullText = fullText.substring(nl + 1);
                    }
                    sourcesHandled = true;
                }

                renderMarkdown(fullText);
                answer.scrollTop = answer.scrollHeight;
            }

            status.textContent = "Completata";

        } catch(err){

            if(err.name === "AbortError"){
                status.textContent = "Interrotta";
            } else {
                console.error(err);
                answer.textContent = err.message;
                status.textContent = "Errore";
            }

        } finally{

            currentController = null;
            submitBtn.disabled = false;
            submitBtn.textContent = "Chiedi all'esperto";
            stopBtn.style.display = "none";

        }

    });

});

</script>

</body>
</html>

services:

  ollama:
    profiles: ["esperto"]
    image: ollama/ollama:0.33.3
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
    - OLLAMA_CONTEXT_LENGTH=${LLM_CONTEXT_TOKENS:-20000}
    - OLLAMA_KV_CACHE_TYPE=q4_0
    - OLLAMA_FLASH_ATTENTION=1
    - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - ./ollama_data:/root/.ollama
    #----per gpu NVIDIA---, eliminare se non si ha scheda NVIDIA#
    deploy:
     resources:
       reservations:
        devices:
           - driver: nvidia
             count: 1 
             capabilities: [gpu]
    #----per gpu NVIDIA---, eliminare se non si ha scheda NVIDIA#
    entrypoint: /bin/sh -c "ollama serve"

  qdrant:
    profiles: ["esperto"]
    image: qdrant/qdrant:v1.19.1
    container_name: qdrant
    ports: ["6333:6333"]
    volumes:
      - ./qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  esperto:
    profiles: ["esperto"]
    build:
      context: ./esperto
      dockerfile: dockerfile
    container_name: esperto
    ports:
      - "5000:5000"
    depends_on:
      ollama:
        condition: service_started
      qdrant:
        condition: service_healthy
    volumes:
      - ./hf_cache:/root/.cache/huggingface
      - ./esperto_state:/app/state
      - esperto_workspace:/app/workspace
      - ./esperto_debug:/app/debug
    env_file:
      - .env
    environment:
      - HF_HOME=/root/.cache/huggingface
      - PROMPT_DEBUG_FILE=/app/debug/last_prompt.json
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  esperto_indexer:
    profiles: ["esperto"]
    build:
      context: ./esperto
      dockerfile: dockerfile
    container_name: esperto_indexer
    command: ["uvicorn", "src.ingestion.api:app", "--host", "0.0.0.0", "--port", "5001"]
    depends_on:
      ollama:
        condition: service_started
      qdrant:
        condition: service_healthy
    volumes:
      - ./hf_cache:/root/.cache/huggingface
      - ./esperto_state:/app/state
      - esperto_workspace:/app/workspace
    env_file:
      - .env
    environment:
      - HF_HOME=/root/.cache/huggingface
      - INGESTION_WORKSPACE_DIR=/app/workspace
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend_esperto:
    profiles: ["esperto"]
    build:
      context: ./frontend_esperto
      dockerfile: dockerfile
    container_name: frontend_esperto
    ports:
      - "8005:8005"
    depends_on:
      esperto:
        condition: service_started
      esperto_indexer:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - ESPERTO_URL=http://esperto:5000
      - ESPERTO_INDEXER_URL=http://esperto_indexer:5001

  benchmark:
    profiles: ["benchmark"]
    build:
      context: ./benchmark
      dockerfile: dockerfile
    container_name: benchmark
    ports:
      - "5002:5002"
    depends_on:
      esperto:
        condition: service_healthy
      esperto_indexer:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - ESPERTO_URL=http://esperto:5000
      - ESPERTO_INDEXER_URL=http://esperto_indexer:5001
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - ./benchmark/datasets:/app/datasets
      - ./benchmark_results:/app/results

volumes:
  esperto_workspace:

services:
  backend:
    profiles: ["parser"]
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "8003:8003"
    container_name: backend
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./gs_data:/app/gs_data:ro
      - ./domains.json:/app/domains.json:ro
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - MYSQL_HOST=database
  
  frontend:
    profiles: ["parser"]
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports:
      - "8004:8004"
    container_name: frontend
    depends_on:
      - backend
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - BACKEND_URL=http://backend:8003

  database:
    profiles: ["parser"]
    image: mariadb:latest
    container_name: database
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - ./mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb -h 127.0.0.1 -u root -p\"$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama:
    profiles: ["parser", "esperto"]
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
    - OLLAMA_CONTEXT_LENGTH=20000
    - OLLAMA_KV_CACHE_TYPE=q4_0
    - OLLAMA_FLASH_ATTENTION=1
    - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - ./ollama_data:/root/.ollama
    #----per gpu NVIDIA---, eliminare se non si ha scheda NVIDIA#
    deploy:
     resources:
       reservations:
        devices:
           - driver: nvidia
             count: 1 
             capabilities: [gpu]
    #----per gpu NVIDIA---, eliminare se non si ha scheda NVIDIA#
    entrypoint: /bin/sh -c "ollama serve"

  adminer:
    profiles: ["parser"]
    image: adminer:latest
    container_name: adminer
    ports:
      - "8080:8080"
    depends_on:
      - database
    environment:
      - ADMINER_DEFAULT_SERVER=database

  qdrant:
    profiles: ["esperto"]
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports: ["6333:6333"]
    volumes:
      - ./qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  esperto:
    profiles: ["esperto"]
    build:
      context: ./esperto
      dockerfile: dockerfile
    container_name: esperto
    ports:
      - "5000:5000"
    depends_on:
      ollama:
        condition: service_started
      qdrant:
        condition: service_healthy
    volumes:
      - ./hf_cache:/root/.cache/huggingface
      - ./esperto_state:/app/state
      - ./esperto_workspace:/app/workspace
      - ./esperto_debug:/app/debug
    env_file:
      - .env
    environment:
      - HF_HOME=/root/.cache/huggingface
      - PROMPT_DEBUG_FILE=/app/debug/last_prompt.json
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  esperto_indexer:
    profiles: ["esperto"]
    build:
      context: ./esperto
      dockerfile: dockerfile
    container_name: esperto_indexer
    command: ["uvicorn", "src.ingestion.api:app", "--host", "0.0.0.0", "--port", "5001"]
    depends_on:
      ollama:
        condition: service_started
      qdrant:
        condition: service_healthy
    volumes:
      - ./hf_cache:/root/.cache/huggingface
      - ./esperto_state:/app/state
      - ./esperto_workspace:/app/workspace
    env_file:
      - .env
    environment:
      - HF_HOME=/root/.cache/huggingface
      - INGESTION_WORKSPACE_DIR=/app/workspace
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend_esperto:
    profiles: ["esperto"]
    build:
      context: ./frontend_esperto
      dockerfile: dockerfile
    container_name: frontend_esperto
    ports:
      - "8005:8005"
    depends_on:
      esperto:
        condition: service_healthy
      esperto_indexer:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - ESPERTO_URL=http://esperto:5000
      - ESPERTO_INDEXER_URL=http://esperto_indexer:5001

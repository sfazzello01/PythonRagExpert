  question: "Quali dipendenze esterne usa requests e come gestisce un eventuale rilevatore di codifica mancante?"
  relevant:
    - {file: src/requests/compat.py, symbol: _resolve_char_detection}
    - {file: src/requests/__init__.py, symbol: check_compatibility}
  key_facts:
    - "Usa urllib3 per il trasporto HTTP."
    - "_resolve_char_detection prova a importare chardet e poi charset_normalizer."
    - "Se nessun rilevatore è disponibile check_compatibility emette RequestsDependencyWarning."
  reference_answer: "urllib3 per il trasporto; compat._resolve_char_detection sceglie chardet o charset_normalizer; __init__.check_compatibility avvisa se manca un rilevatore."

- id: ar10
  category: architecture
  question: "Quali strutture dati di supporto fornisce il package per header e codici di stato?"
  relevant:
    - {file: src/requests/structures.py, symbol: CaseInsensitiveDict}
    - {file: src/requests/structures.py, symbol: LookupDict}
  key_facts:
    - "CaseInsensitiveDict è usato per gli header."
    - "LookupDict è usato per requests.codes."
    - "LookupDict.__getitem__ restituisce None per le chiavi mancanti."
  reference_answer: "structures.py: CaseInsensitiveDict (header) e LookupDict (codes, con default None per chiavi assenti)."

